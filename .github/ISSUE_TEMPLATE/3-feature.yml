name: 功能建议
description: 提议新的能力或改进现有体验
labels: [enhancement, 'status:triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你遇到的场景，以及现在为什么不够好。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
