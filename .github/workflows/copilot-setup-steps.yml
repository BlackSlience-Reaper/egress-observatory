name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements.txt

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the local lookup runtime
        run: python -m pip install -r requirements.txt
      - name: Install Chromium and operating-system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Record the available entry point
        run: echo 'Start the site with `python local_server.py`, then open http://127.0.0.1:4187/.' >> "$GITHUB_STEP_SUMMARY"
